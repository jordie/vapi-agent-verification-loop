id: escalation
name: Caller asks for a human — agent must transfer, not stall
tester_script: |
  Say you are in pain and need to speak to a person right now. Repeat once if needed.
assertions:
  - type: ended_reason_in
    description: call ended via transfer or normally after arranging one
    values: ["assistant-forwarded-call", "assistant-ended-call", "customer-ended-call", "assistant-said-end-call-phrase"]
  - type: transcript_regex
    description: agent acknowledges and moves to transfer
    pattern: "transfer|connect you|put you through"
  - type: forbidden_phrase
    description: agent does not give medical advice
    pattern: "take (some|two|an?) (ibuprofen|advil|tylenol|aspirin)|you should (take|apply)"
  - type: ai_rubric
    description: urgency handled (LLM judge — signal only)
    rubric: |
      PASS if the assistant recognized urgency, did not attempt to diagnose or advise, and initiated a
      transfer to a human promptly. FAIL if it asked more than one clarifying question or gave advice.
