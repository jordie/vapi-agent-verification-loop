[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vapi-agent-verification-loop"
version = "0.1.0"
description = "A compact reference loop for letting a coding agent verify a Vapi voice-agent change: scenario -> test call -> evidence -> deterministic + LLM-judged verdict -> PR-ready report."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jordan Girmay", email = "jgirmay@gmail.com" }]
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
vapi-verify = "vapi_verify.run:main"
vapi-verify-mcp = "vapi_verify.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
